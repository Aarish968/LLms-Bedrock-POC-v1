[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tagging_flows"
version = "0.3.4"
description = "Tagging Flows"
readme = "README.md"
authors = [
  {name = "Eric Stasney", email = "estasney@cisco.com"}
]
requires-python = ">=3.12"

dependencies = [
    "common-prefect-next[excel]>=0.16.6",
    "common-serial-resolution>=0.4.0",
    "prefect>3",
    "snowflake-sqlalchemy",
    "sqlalchemy>2",
    "pydantic>2",
    "pydantic-settings",
    "toolz>=1.0.0",
]

[dependency-groups]
linters = [ "ruff>=0.9.0"]
dev = [
 "keyring>=25.6.0",
 "pre-commit>=4.1.0",
 "pytest>=8.3.3",
 "wheel>=0.45.1",
]

[tool.uv]
default-groups = [ "linters", "dev"]


[tool.uv.sources.common-prefect-next]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common_prefect_next.git"
branch = "master"

[tool.uv.sources.common-serial-resolution]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common-serial-resolution.git"
branch = "master"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [ "A", "ANN", "ASYNC", "B", "C4", "EM", "ERA", "ERA", "F", "FA", "FIX", "G", "I", "ICN", "LOG", "NPY", "PD", "PERF", "PGH", "PIE", "PL", "RUF", "SIM", "SLOT", "T10", "TC", "TCH", "TD", "TRY",]
ignore = [ "F401", "F403", "PLR0913", "FA100", "FA102", "PLR", "PLC0415", "RUF012", "PD901", "ANN401",]


[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["I"]
"tests/**" = ["A", "I", "ANN"]


[tool.ruff.lint.flake8-type-checking]
# Add quotes around type annotations, if doing so would allow
# an import to be moved into a type-checking block.
quote-annotations = true
runtime-evaluated-base-classes = ["pydantic.BaseModel", "tagging_flows.common.models.Model"]
exempt-modules = ["typing", "pydantic", "datetime", "common_prefect_next.blocks.database", "common_prefect_next.blocks.environment", "common_prefect_next.blocks.aws", "tagging_flows.common.models"]
strict = false

[tool.hatch.version]
path = "src/tagging_flows/__version__.py"

[tool.pytest.ini_options]
addopts = "--strict-markers --showlocals --capture=tee-sys"
asyncio_mode = "auto"
