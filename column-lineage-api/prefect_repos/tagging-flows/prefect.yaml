name: tagging_flows_prod
prefect-version: 3.4.5

definitions:
  - &bundle_name tagging_flows_prod
  - &extra_loggers tagging_flows,common_prefect_next,common_serial_resolution
  - &env prod
  - deployment_names:
    - &deployment_instance_tagging instance_tagging_prod
    - &deployment_serial_tagging serial_tagging_prod
    - &deployment_bulk_tagging bulk_tagging_prod
    - &deployment_thoughtspot_tagging thoughtspot_tagging_prod
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name: "{{prefect.variables.work_queue_prod}}"
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: *extra_loggers
  - entrypoints:
      - &instance_tagging tagging_flows.main:instance_tagging_flow
      - &serial_tagging tagging_flows.main:serial_tagging_flow
      - &bulk_tagging tagging_flows.main:bulk_tagging_flow
      - &thoughtspot_tagging tagging_flows.main:thoughtspot_tagging_flow
  - push: &push
      - prefect.deployments.steps.run_shell_script:
          id: echo_version
          script: |
            uv run python -c "import importlib.metadata; print(importlib.metadata.version('tagging_flows'))"
          stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          version: '{{echo_version.stdout}}'
          extra_sources:
              - common-prefect-next[excel]
              - common-serial-resolution
          stream_output: true
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - pull: &pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install /tmp/wheels/*.whl'

push: *push

deployments:
  - name: *deployment_instance_tagging
    tags:
      - *env
      - instance_tagging
    version: '{{echo_version.stdout}}'
    description: 'Instance Tagging'
    entrypoint: *instance_tagging
    parameters: { "env": *env, "warehouse":'{{prefect.variables.warehouse_small}}', 'warehouse_larger': '{{prefect.variables.warehouse_large}}'}
    work_pool: *default_work_pool
    pull: *pull
    push: *push
    enforce_parameter_schema: true
  - name: *deployment_serial_tagging
    tags:
      - *env
      - serial_tagging
    version: '{{echo_version.stdout}}'
    description: 'Serial Tagging'
    entrypoint: *serial_tagging
    parameters: { "env": *env, "warehouse":'{{prefect.variables.warehouse_small}}', 'warehouse_larger': '{{prefect.variables.warehouse_large}}'}
    work_pool: *default_work_pool
    pull: *pull
    push: *push
    enforce_parameter_schema: true
  - name: *deployment_bulk_tagging
    tags:
      - *env
      - bulk_tagging
    version: '{{echo_version.stdout}}'
    description: 'Bulk Tagging'
    entrypoint: *bulk_tagging
    parameters: { "env": *env, "warehouse":'{{prefect.variables.warehouse_small}}', 'warehouse_larger': '{{prefect.variables.warehouse_large}}'}
    work_pool: *default_work_pool
    pull: *pull
    push: *push
    enforce_parameter_schema: true
  - name: *deployment_thoughtspot_tagging
    tags:
      - *env
      - thoughtspot_tagging
    version: '{{echo_version.stdout}}'
    description: 'ThoughtSpot Tagging'
    entrypoint: *thoughtspot_tagging
    parameters: { "env": *env, "warehouse":'{{prefect.variables.warehouse_small}}', 'warehouse_larger': '{{prefect.variables.warehouse_large}}'}
    work_pool: *default_work_pool
    pull: *pull
    push: *push
    enforce_parameter_schema: true