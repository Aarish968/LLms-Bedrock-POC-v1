name: macd_audit_dev
prefect-version: 3.1.12

definitions:
  - &bundle_name macd_audit_dev
  - &extra_loggers macd_audit,common_prefect_next,common_serial_resolution
  - &env dev
  - deployment_names:
    - &deployment_macd_audit macd_audit_dev
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name: "{{prefect.variables.work_queue_dev}}"
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: *extra_loggers
  - entrypoints:
      - &my_flow macd_audit.main:macd_audit_flow
  - push: &push
      - prefect.deployments.steps.run_shell_script:
          id: echo_version
          script: |
            uv run python -c "import importlib.metadata; print(importlib.metadata.version('macd_audit'))"
          stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          version: "{{echo_version.stdout}}"
          extra_sources:
              - common-prefect-next[excel]
              - common-serial-resolution
          stream_output: true
          requires: common_prefect_next
          force: true
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - pull: &pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install /tmp/wheels/*.whl'
deployments:
  - name: *deployment_macd_audit
    tags:
      - *env
      - create_macd_audit
    version: '{{echo_version.stdout}}'
    description: 'Create a MACD audit report from serial or instance ids'
    entrypoint: *my_flow
    parameters: { "env": *env, "warehouse":'{{prefect.variables.warehouse_medium}}'}
    work_pool: *default_work_pool
    pull: *pull
    push: *push
    enforce_parameter_schema: true
