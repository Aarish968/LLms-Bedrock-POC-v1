version: 0.2
env:
  variables:
    TENANT: cisco-dev
    FLOW_PATH: daily_dc_metrics.py
    PROJECT_NAME: "ElasticSearch Canvas Load"
  secrets-manager:
    API_KEY: prefect-api-key:prefect-api-key
phases:
  install:
    runtime-versions:
      docker: 19
      python: 3.8
    commands:
    - pip install -r requirements.txt
  build:
    commands:
      - echo "Logging into Prefect cloud"
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 837578041534.dkr.ecr.us-east-1.amazonaws.com
      - prefect auth login -k $API_KEY
      - prefect auth switch-tenants --slug $TENANT
      - echo $PROJECT_NAME ${PROJECT_NAME}
      - prefect register -p $FLOW_PATH --project "ElasticSearch Canvas Load"