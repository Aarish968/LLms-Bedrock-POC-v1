[project]
name = "thoughtspot-flows"
version = "0.7.3"
description = "Prefect V3 Flows for ThoughtSpot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
 "prefect>=3.1.12",
 "common-prefect-next>=0.15.2",
 "dc-canvas-service>=0.4.34",
]

[[project.authors]]
name = "Eric Stasney (estasney)"
email = "estasney@cisco.com"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
linters = [ "ruff>=0.9.3",]
dev = [
 "pre-commit>=4.1.0",
 "pytest>=8.3.3",
 "pytest-mock>=3.14.0",
 "wheel>=0.45.1",
]

[tool.uv]
default-groups = [ "linters", "dev",]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [ "A", "ANN", "ASYNC", "B", "C4", "EM", "ERA", "ERA", "F", "FA", "FIX", "G", "I", "ICN", "LOG", "NPY", "PD", "PERF", "PGH", "PIE", "PL", "RUF", "SIM", "SLOT", "T10", "TC", "TCH", "TD", "TRY",]
ignore = [ "F401", "F403", "PLR0913", "FA100", "FA102", "PLR", "PLC0415", "RUF012", "PD901", "ANN401", "ANN204",]

[tool.uv.sources.common-prefect-next]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common_prefect_next.git"
branch = "master"

[tool.uv.sources.dc-canvas-service]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/dc-canvas-service"
branch = "master"

[tool.ruff.lint.per-file-ignores]
"src/thoughtspot_flows/main.py" = [ "TC002",]
"**/__init__.py" = [ "F401", "I",]
"tests/**.py" = [ "ANN",]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
exempt-modules = [ "typing", "typing_extensions", "pydantic", "common_canvas_next.models.enums", "common_prefect_next", "datetime",]
runtime-evaluated-base-classes = [ "common_canvas_next.models.ModelBase", "pydantic.BaseModel",]
