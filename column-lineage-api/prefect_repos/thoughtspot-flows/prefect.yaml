name: thoughtspot_flows_prod
prefect_version: 3.1.12

definitions:
  - &bundle_name thoughtspot_flows_prod
  - &extra_loggers common_canvas_next,thoughtspot_flows,dc_canvas_service
  - &env prod
  - deployment_names:
      - &deployment_handle_canvas_created ts_handle_canvas_created_prod
      - &deployment_handle_canvas_rebuild ts_handle_canvas_rebuild_prod
      - &deployment_handle_canvas_deleted ts_handle_canvas_deleted_prod
      - &deployment_handle_canvas_view_refresh ts_handle_canvas_view_refresh_prod
      - &deployment_handle_file_management ts_handle_file_management_prod
      - &deployment_handle_engagement_share ts_handle_engagement_share_prod
      - &deployment_handle_canvas_discover ts_handle_canvas_discover_prod
      - &deployment_handle_canvas_cleanup ts_handle_canvas_cleanup_prod
  - resources:
    - &canvas_resource datacanvas.prod.canvas.*
    - &engagement_resource datacanvas.prod.engagement.*
  - events:
      - &canvas_create_success datacanvas.canvas.create.success
      - &canvas_rebuild_success datacanvas.canvas.rebuild.success
      - &canvas_share_requested datacanvas.engagement.share.requested
      - &canvas_refresh_success datacanvas.canvas.refresh.success
      - &canvas_delete_requested datacanvas.canvas.delete.requested
      - &liveboard_manage_requested thoughtspot.liveboards.manage.requested
      - &canvas_discover_requested thoughtspot.liveboards.discover.requested
      - &canvas_cleanup_requested datacanvas.canvas.cleanup.requested

  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name: "{{prefect.variables.work_queue_thoughtspot_prod}}"
      job_variables:
        image: "{{prefect.variables.docker_base_312}}"
        image_pull_policy: Always
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: *extra_loggers
  - entrypoints:
    - &canvas_created_entry thoughtspot_flows.canvas_created:handle_canvas_created
    - &canvas_rebuild_entry thoughtspot_flows.canvas_rebuild:handle_canvas_rebuild
    - &sharing_entry thoughtspot_flows.sharing:handle_engagement_shared
    - &canvas_deleted_entry thoughtspot_flows.canvas_deleted:handle_canvas_deleted
    - &canvas_view_refresh_entry thoughtspot_flows.canvas_view_refresh:handle_canvas_view_refresh
    - &liveboard_manage_entry thoughtspot_flows.liveboard_manage:handle_liveboard_manage_request
    - &canvas_discover_entry thoughtspot_flows.canvas_discover:handle_canvas_discover
    - &canvas_cleanup_entry thoughtspot_flows.canvas_cleanup:handle_canvas_cleanup
  - push: &push
    - prefect.deployments.steps.run_shell_script:
        id: echo_version
        script: |
          uv run python -c "import importlib.metadata; print(importlib.metadata.version('thoughtspot_flows'))"
        stream_output: true
    - common_prefect_next.deployments.steps.build_code_bundle:
        id: bundle_code
        bundle_name: *bundle_name
        extra_sources:
          - dc-canvas-service
          - common-prefect-next
        stream_output: true
        requires: common_prefect_next
    - prefect.deployments.steps.set_working_directory:
        id: set_working_directory
        directory: dist
    - prefect_aws.deployments.steps.push_to_s3:
        id: push_code
        requires: prefect-aws>=0.3.4
        bucket: prefect2.flow.code
        folder: *bundle_name
    - prefect.deployments.steps.set_working_directory:
        id: set_working_directory
        directory: ..
  - pull: &pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
              mkdir -p /tmp/wheels
              tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
              bash -c 'pip install /tmp/wheels/*.whl'
  - trigger_params_std: &trigger_params_std
      canvas_id: &canvas_id_param
        template: "{{event.payload.canvas_id}}"
        __prefect_kind: jinja
      notification_id: &notification_id_param
        template: "{{event.payload.notification_id}}"
        __prefect_kind: jinja
      dc_user_id: &dc_user_id_param
        template: "{{event.payload.dc_user_id}}"
        __prefect_kind: jinja
      dc_engagement_id: &dc_engagement_id_param
        template: '{{event.payload.dc_engagement_id}}'
        __prefect_kind: jinja
  - trigger_params_share: &trigger_params_share
      <<: *trigger_params_std
      shared_with_dc_user_id: &shared_with_dc_user_id_param
        template: '{{event.payload.shared_with_dc_user_id}}'
        __prefect_kind: jinja
      request_id: &request_id_param
        template: '{{event.payload.request_id}}'
        __prefect_kind: jinja
  - trigger_params_file_management: &trigger_params_file_management
      request_id: *request_id_param
      <<: *trigger_params_std
  - trigger_params_canvas_discover: &trigger_params_canvas_discover
      request_id: *request_id_param
      <<: *trigger_params_std
  - trigger_params_canvas_cleanup: &trigger_params_canvas_cleanup
      canvas_id: *canvas_id_param


  - trigger_names:
      - &trigger_canvas_created_name handle_canvas_created_trigger_prod
      - &trigger_canvas_rebuild_name handle_canvas_rebuild_trigger_prod
      - &trigger_canvas_deleted_name handle_canvas_deleted_trigger_prod
      - &trigger_canvas_view_refresh_name handle_canvas_view_refresh_trigger_prod
      - &trigger_file_management_name handle_file_management_trigger_prod
      - &trigger_engagement_share_name handle_engagement_share_trigger_prod
      - &trigger_canvas_discover_name handle_canvas_discover_trigger_prod
      - &trigger_canvas_cleanup_name handle_canvas_cleanup_trigger_prod
  - triggers:
      - trigger_canvas_created: &trigger_canvas_created
          - type: event
            name: *trigger_canvas_created_name
            description: When a canvas is created, trigger the thoughtspot flow
            enabled: true
            match:
              prefect.resource.id: *canvas_resource
            expect:
              - *canvas_create_success
            parameters:
              env: *env
              <<: *trigger_params_std
      - trigger_canvas_rebuild: &trigger_canvas_rebuild
          - type: event
            name: *trigger_canvas_rebuild_name
            description: When a canvas is rebuilt, trigger the thoughtspot flow
            enabled: true
            match:
              prefect.resource.id: *canvas_resource
            expect:
              - *canvas_rebuild_success
            parameters:
              env: *env
              <<: *trigger_params_std
      - trigger_canvas_deleted: &trigger_canvas_deleted
          - type: event
            name: *trigger_canvas_deleted_name
            description: When a canvas is deleted, trigger the thoughtspot flow
            enabled: true
            match:
              prefect.resource.id: *canvas_resource
            expect:
              - *canvas_delete_requested
            parameters:
              env: *env
              <<: *trigger_params_std
      - trigger_canvas_view_refresh: &trigger_canvas_view_refresh
          - type: event
            name: *trigger_canvas_view_refresh_name
            description: When a canvas view is refreshed, trigger the thoughtspot flow
            enabled: true
            match:
              prefect.resource.id: *canvas_resource
            expect:
              - *canvas_refresh_success
            parameters:
              env: *env
              <<: *trigger_params_std
      - trigger_file_management: &trigger_file_management
          - type: event
            name: *trigger_file_management_name
            description: When a file management event is triggered, trigger the thoughtspot flow
            enabled: true
            match:
              prefect.resource.id: *canvas_resource
            expect:
              - *liveboard_manage_requested
            parameters:
              env: *env
              <<: *trigger_params_file_management
      - trigger_engagement_share: &trigger_engagement_share
          - type: event
            name: *trigger_engagement_share_name
            description: When a canvas is shared, trigger the thoughtspot flow
            enabled: true
            match:
              prefect.resource.id: *engagement_resource
            expect:
              - *canvas_share_requested
            parameters:
              env: *env
              dc_engagement_id: *dc_engagement_id_param
              notification_id: *notification_id_param
              dc_user_id: *dc_user_id_param
              shared_with_dc_user_id: *shared_with_dc_user_id_param
              request_id: *request_id_param
      - trigger_canvas_discover: &trigger_canvas_discover
            - type: event
              name: *trigger_canvas_discover_name
              description: When a user requests to discover liveboards, trigger the thoughtspot flow
              enabled: true
              match:
                prefect.resource.id: *canvas_resource
              expect:
                - *canvas_discover_requested
              parameters:
                <<: *trigger_params_canvas_discover
                env: *env
      - trigger_canvas_cleanup: &trigger_canvas_cleanup
            - type: event
              name: *trigger_canvas_cleanup_name
              description: When a non-user initiated canvas cleanup is requested
              enabled: true
              match:
                prefect.resource.id: *canvas_resource
              expect:
                - *canvas_cleanup_requested
              parameters:
                <<: *trigger_params_canvas_cleanup
                env: *env

deployments:
  - name: *deployment_handle_canvas_created
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
    description: After a canvas is created, trigger the thoughtspot flow to check for liveboards to import
    entrypoint: *canvas_created_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_canvas_created
    parameters:
      env: *env
  - name: *deployment_handle_canvas_rebuild
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
    description: After a canvas is rebuilt, trigger the thoughtspot flow to update data sources
    entrypoint: *canvas_rebuild_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_canvas_rebuild
    parameters:
      env: *env
  - name: *deployment_handle_canvas_deleted
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
    description: After a canvas is deleted, trigger the thoughtspot flow to delete the canvas from thoughtspot
    entrypoint: *canvas_deleted_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_canvas_deleted
    parameters:
      env: *env
  - name: *deployment_handle_canvas_view_refresh
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
    description: After a canvas view is refreshed, trigger the thoughtspot flow to refresh the liveboard in thoughtspot
    entrypoint: *canvas_view_refresh_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_canvas_view_refresh
    parameters:
      env: *env
  - name: *deployment_handle_file_management
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
      - manage_liveboard
    description: After a file management event is triggered, trigger the thoughtspot flow to manage the liveboard in thoughtspot
    entrypoint: *liveboard_manage_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_file_management
    parameters:
      env: *env
  - name: *deployment_handle_engagement_share
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
      - share_engagement
    description: After a canvas is shared, trigger the thoughtspot flow to share the canvas in thoughtspot
    entrypoint: *sharing_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_engagement_share
    parameters:
      env: *env

  - name: *deployment_handle_canvas_discover
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
      - discover_liveboards
    description: Use dc-canvas-service to discover liveboards
    entrypoint: *canvas_discover_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_canvas_discover
    parameters:
      env: *env
  - name: *deployment_handle_canvas_cleanup
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - thoughtspot
    description: Use dc-canvas-service to cleanup liveboards from a non-user initiated event
    entrypoint: *canvas_cleanup_entry
    work_pool: *default_work_pool
    enforce_parameter_schema: false # Required to work with automations
    push: *push
    pull: *pull
    triggers:
      - <<: *trigger_canvas_cleanup
    parameters:
      env: *env










