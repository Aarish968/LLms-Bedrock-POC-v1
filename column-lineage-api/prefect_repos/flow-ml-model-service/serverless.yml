
service: mlmodelservice-ej
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name

# You can pin your service to only deploy with a specific Serverless version
# Check out our docs for more details
#frameworkVersion: '2'

provider:
  name: aws
  runtime: python3.8
  timeout: 900
  stage: prod
  region: us-east-1

# you can overwrite defaults here
#  stage: dev
#  region: us-east-1

# you can add statements to the Lambda function's IAM Role here
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        Fn::Join:
          - ""
          - - "arn:aws:ssm:"
            - Ref: AWS::Region
            - ":"
            - Ref: AWS::AccountId
            - ":parameter/*"
    - Effect: 'Allow'
      Action:
        - '*'
      Resource:
        - arn:aws:s3:::${self:custom.modelCodeBucket}/*
        - arn:aws:s3:::${self:custom.modelCodeBucket}

# you can define service wide environment variables here
#  environment:
#    variable1: value1

# you can add packaging information here
#package:
#  patterns:
#    - '!exclude-me.py'
#    - '!exclude-me-dir/**'
#    - include-me.py
#    - include-me-dir/**

functions:
  load:
    handler: handler.run
    layers:
          - { Ref: PythonRequirementsLambdaLayer }
    reservedConcurrency: 50
    events:
      - s3:
          bucket: ${self:custom.modelCodeBucket}
          event: s3:ObjectCreated:*
          existing: true


plugins:
  - serverless-python-requirements
  - serverless-ignore
custom:
  pythonRequirements:
    dockerizePip: non-linux
    slim: true
    layer: true
  modelCodeBucket: cam.dev.model.inputs.test
