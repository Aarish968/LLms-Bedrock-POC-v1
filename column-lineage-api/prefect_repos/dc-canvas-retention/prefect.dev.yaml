name: dc_canvas_retention_dev
prefect-version: 3.1.12

definitions:
  - &bundle_name dc_canvas_retention_dev
  - &extra_loggers dc_canvas_retention,common_prefect_next
  - &env dev
  - deployment_names:
    - &deployment_dc_canvas_retention dc_canvas_retention_dev
  - parameters: &default_parameters
      env: *env
      warehouse: '{{prefect.variables.warehouse_small}}'
      n_days_deactivate: 70
      n_days_delete: 120
      row_count_threshold: 1000000000
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name: "{{prefect.variables.work_queue_thoughtspot_dev}}"
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: *extra_loggers
  - entrypoints:
      - &retention_flow dc_canvas_retention.main:dc_canvas_retention_flow
  - push: &push
      - prefect.deployments.steps.run_shell_script:
          id: echo_version
          script: |
            uv run python -c "import importlib.metadata; print(importlib.metadata.version('dc_canvas_retention'))"
          stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          extra_sources:
              - common-prefect-next
              - common-canvas-next
          stream_output: true
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - pull: &pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install /tmp/wheels/*.whl'

deployments:
  - name: *deployment_dc_canvas_retention
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
      - dc_canvas_retention
    description: 'A prefect flow for DC Canvas retention (deactivate and delete old canvases).'
    entrypoint: *retention_flow
    parameters: *default_parameters
    work_pool: *default_work_pool
    pull: *pull
    push: *push
    enforce_parameter_schema: true
    schedules:
      - cron: "0 2 * * 1-5"
        timezone: "America/New_York"
        active: true
