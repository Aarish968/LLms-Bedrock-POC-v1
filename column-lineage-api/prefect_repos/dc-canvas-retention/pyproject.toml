[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dc_canvas_retention"
dynamic = ["version"]
description = "A prefect flow for DC Canvas retention (deactivate and delete old canvases)."
readme = "README.md"
authors = [
  {name = "Wojciech Polesiak", email = "wpolesia@cisco.com"}
]
requires-python = ">=3.12"

dependencies = [
    "common-prefect-next",
    "common-canvas-next",
    "prefect>3",
    "snowflake-sqlalchemy",
    "sqlalchemy>2",
    "pydantic>2",
    "pydantic-settings"
]

[dependency-groups]
linters = [ "ruff>=0.9.0"]
dev = [
 "pre-commit>=4.1.0",
 "pytest>=8.3.3",
 "wheel>=0.45.1",
]

[tool.uv]
default-groups = [ "linters", "dev"]


[tool.uv.sources.common-prefect-next]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common_prefect_next.git"
branch = "master"

[tool.uv.sources.common-canvas-next]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common-canvas-next.git"
branch = "master"


[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [ "A", "ANN", "ASYNC", "B", "C4", "EM", "ERA", "ERA", "F", "FA", "FIX", "G", "I", "ICN", "LOG", "NPY", "PD", "PERF", "PGH", "PIE", "PL", "RUF", "SIM", "SLOT", "T10", "TC", "TCH", "TD", "TRY",]
ignore = [ "F401", "F403", "G004", "PLR0913", "FA100", "FA102", "PLR", "PLC0415", "RUF012", "PD901", "ANN401",]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I"]
"tests/**.py" = ["ANN", "TC"]


[tool.ruff.lint.flake8-type-checking]
# Add quotes around type annotations, if doing so would allow
# an import to be moved into a type-checking block.
quote-annotations = true
runtime-evaluated-base-classes = ["pydantic.BaseModel", "dc_canvas_retention.models.Model"]
exempt-modules = ["typing", "pydantic", "datetime"]
strict = false

[tool.hatch.version]
path = "src/dc_canvas_retention/__version__.py"

[tool.pyrefly]
project_includes = ["**/*"]
project_excludes = [
    "**/.[!/.]*",
    "**/*venv/**/*",
]
