name: table_snapshots_cleanup_prod
prefect-version: 3.2.13

definitions:
  - &bundle_name table_snapshots_cleanup_prod

  - &env prod
  - deployment_names:
    - &cleanup_prod table_snapshots_cleanup_prod
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name: 
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: table_snapshots,common_prefect_next
  - entrypoints:
    - &snapshots_entry daily_table_snapshots.main:table_snapshots_cleanup_flow
  - push: &prod_push
      - prefect.deployments.steps.run_shell_script:
          id: echo_version
          script: |
            uv run python -c "import importlib.metadata; print(importlib.metadata.version('daily-table-snapshots'))"
          stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          extra_sources:
            - common-prefect-next
            - common-serial-resolution
          stream_output: true
          version: "{{echo_version.stdout}}"
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - pull: &prod_pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install /tmp/wheels/*.whl'

weekly_schedule: &weekly_schedule
  - cron: "0 01 * * 0"
    timezone: "America/New_York"
    active: true

push: *prod_push
deployments:
  - name: *cleanup_prod
    version: '{{echo_version.stdout}}'
    tags:
      - *env
      - table_cleanup
    concurrency_limit:
    description: "Cleanup table snapshots based on retention policy"
    entrypoint: *snapshots_entry
    parameters: { "warehouse": "cps_dsci_etl_ext5_wh"}
    work_pool: *default_work_pool
    pull: *prod_pull
    enforce_parameter_schema: true
    schedules: *weekly_schedule
    
