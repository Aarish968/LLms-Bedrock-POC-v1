# Generic metadata about this project
name: generate_evidence_flows_dev
prefect-version: 3.1.12

definitions:
  - &bundle_name generate_evidence_flows_dev
  - &extra_loggers generate_evidence_flows,common_prefect_next
  - &env dev
  - deployment_names:
    - &evidence_zone_aggregates_dev evidence_zone_aggregates_dev
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name: "{{prefect.variables.work_queue_dev}}"
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: *extra_loggers
  - entrypoints:
      - &evidence_zone_aggregates_entry generate_evidence_flows.main:evidence_zone_aggregates
  - push: &dev_push
      - prefect.deployments.steps.run_shell_script:
            id: echo_version
            script: |
              uv run python -c "import importlib.metadata; print(importlib.metadata.version('generate_evidence_flows'))"
            stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          version: "{{echo_version.stdout}}"
          extra_sources:
            - common-prefect-next
          stream_output: true
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - dev_pull: &dev_pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install /tmp/wheels/*.whl'

push: *dev_push

daily_schedule: &daily_schedule
  - cron: "0 * * * *"
    timezone: "America/New_York"
    active: true

deployments:
  - name: *evidence_zone_aggregates_dev
    version: "{{echo_version.stdout}}"
    tags:
      - *env
      - evidence_zone_aggregates
    concurrency_limit:
    description: "Generate evidence zones aggregates"
    entrypoint: *evidence_zone_aggregates_entry
    parameters: { "env": *env, "warehouse": '{{prefect.variables.warehouse_xsmall}}' }
    work_pool: *default_work_pool
    pull: *dev_pull
    enforce_parameter_schema: true
    schedules:
      *daily_schedule