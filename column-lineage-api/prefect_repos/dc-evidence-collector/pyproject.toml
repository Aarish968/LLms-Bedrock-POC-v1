[project]
name = "dc-evidence-collector"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.35.52",
    "numpy<2",
    "pandas<2",
    "snowflake-sqlalchemy>=1.6.1",
    "sqlalchemy<2",
]

[project.optional-dependencies]
linters = [
    "ruff>=0.7.1",
]




[tool.ruff]
exclude = [".git", ".idea", ".vscode", "venv", ".venv", ".mypy_cache", ".pytest_cache", ".ruff", "site-packages", "tests", "scripts"]
preview = false

[tool.ruff.lint]
select = ["I", "F", "ASYNC", "B", "C4", "T10", "FA", "ICN", "LOG", "SIM", "ERA", "PD", "PL", "NPY", "RUF", "TCH"]
ignore = ["F401", "F403", "PLR0913", "FA100", "FA102", "PLR", "PLC0415", "RUF012", "PD901"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.lint.flake8-type-checking]
# Add quotes around type annotations, if doing so would allow
# an import to be moved into a type-checking block.
quote-annotations = true
exempt-modules = ["typing", "typing_extensions"]

[tool.uv]
dev-dependencies = [
    "common-tasks",
    "prefect==0.15.13",
]

[tool.uv.sources]
common-tasks = { git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common-prefect.git" }
