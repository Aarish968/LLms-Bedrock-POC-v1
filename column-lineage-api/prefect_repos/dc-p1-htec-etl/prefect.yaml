lets ne# File: prefect.yaml
name: dc-p1-htec-etl
prefect-version: 3.0.0

build:
  - prefect.deployments.steps.run_shell_script:
      script: pip install -e ".[dev]"
      id: install-package

push:
  - prefect.deployments.steps.set_working_directory:
      directory: .

deployments:
  dc-p1-htec-etl:
    name: dc-p1-htec-etl
    entrypoint: src/dc_p1_htec_etl/main.py:flow
    work_pool:
      name: kubernetes-pool
    work_queue_name: default
    parameters:
      sf_env: prod
    infra_overrides:
      name: htec-etl
      memory_request: 1024Mi
      memory_limit: 2048Mi
      cpu_request: 1000m
      cpu_limit: 2000m
      service_account_name: builder
      job_ttl_seconds_after_finished: 300
    tags:
      - htec-etl
      - datacanvas
      - prod