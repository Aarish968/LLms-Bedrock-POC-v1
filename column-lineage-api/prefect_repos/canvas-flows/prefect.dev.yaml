# Generic metadata about this project
name: canvas_flows_dev
prefect-version: 3.4.1

definitions:
  - &bundle_name canvas_flows_dev
  - &common_canvas_next 'git+https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common-canvas-next.git@dev'
  - &common_prefect_next 'git+https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common_prefect_next.git@dev'
  - &env dev
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name:
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: common_canvas_next,canvas_flows
  - entrypoints:
      - &canvas_create_entry canvas_flows.create_canvas:create_canvas_flow
      - &canvas_rebuild_entry canvas_flows.rebuild_canvas:rebuild_canvas_flow
      - &canvas_refresh_entry canvas_flows.refresh_canvas_view:refresh_canvas_view_flow
      - &engagement_refresh_entry canvas_flows.refresh_engagement_views:refresh_engagement_views_flow
  - events:
      - &engagement_refresh_requested datacanvas.engagement.refresh.requested
  - push: &dev_push
      - prefect.deployments.steps.run_shell_script:
            id: echo_version
            script: |
              uv run python -c "import importlib.metadata; print(importlib.metadata.version('canvas_flows'))"
            stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          extra_sources:
            - *common_canvas_next
            - *common_prefect_next
          stream_output: true
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - dev_pull: &dev_pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install --force-reinstall /tmp/wheels/*.whl'
  - resources:
    - &engagement_resource datacanvas.dev.engagement.*
  - trigger_params_engagement_refresh: &trigger_params_engagement_refresh
      env: *env
      payload:
        request_id:
          template: "{{event.payload.request_id}}"
          __prefect_kind: jinja
        notification_id:
          template: "{{event.payload.notification_id}}"
          __prefect_kind: jinja
        dc_user_id:
          template: "{{event.payload.dc_user_id}}"
          __prefect_kind: jinja
        dc_engagement_id:
          template: "{{event.payload.dc_engagement_id}}"
          __prefect_kind: jinja
  - trigger_names:
      - &trigger_engagement_refresh_name handle_engagement_refresh_trigger_dev
  - triggers:
      - trigger_engagement_refresh: &trigger_engagement_refresh
          - type: event
            name: *trigger_engagement_refresh_name
            description: When a user adds a tagset, trigger the engagement refresh flow
            enabled: true
            match:
              prefect.resource.id: *engagement_resource
            expect:
              - *engagement_refresh_requested
            parameters:
              <<: *trigger_params_engagement_refresh
push: *dev_push
      

deployments:
  - name: create_canvas_dev
    version: "{{echo_version.stdout}}"
    tags:
      - dev
      - create_canvas
    description: 'Create a new canvas'
    entrypoint: *canvas_create_entry
    parameters: { "env": "dev", "warehouse": '{{prefect.variables.warehouse_large}}', "empty_scope_policy": "raise" }
    work_pool: *default_work_pool
    pull: *dev_pull

    enforce_parameter_schema: true

  - name: rebuild_canvas_dev
    version: "{{echo_version.stdout}}"
    tags:
      - dev
      - rebuild_canvas
    description: 'Rebuild an existing canvas'
    entrypoint: *canvas_rebuild_entry
    parameters: { "env": "dev", "warehouse": '{{prefect.variables.warehouse_large}}', "empty_scope_policy": "raise" }
    work_pool: *default_work_pool
    pull: *dev_pull
    enforce_parameter_schema: true

  - name: refresh_canvas_view_dev
    version: "{{echo_version.stdout}}"
    tags:
      - dev
      - refresh_canvas_view
    concurrency_limit:
    description: 'Rebuild the canvas SQL view'
    entrypoint: *canvas_refresh_entry
    parameters: { "env": "dev", "warehouse": '{{prefect.variables.warehouse_small}}' }
    work_pool: *default_work_pool
    pull: *dev_pull
    enforce_parameter_schema: true

  - name: refresh_engagement_views_dev
    version: "{{echo_version.stdout}}"
    tags:
      - *env
      - refresh_engagement_views
    concurrency_limit:
    description: 'Rebuild all Canvas View for an engagement'
    entrypoint: *engagement_refresh_entry
    parameters:
      env: *env
      warehouse: '{{prefect.variables.warehouse_small}}'
    work_pool: *default_work_pool
    pull: *dev_pull
    triggers:
      - <<: *trigger_engagement_refresh
    enforce_parameter_schema: false # Required to work with automations
