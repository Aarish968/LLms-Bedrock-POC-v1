[project]
name = "canvas-flows"
version = "0.7.4"
description = "Prefect flows for managing canvas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [ "common-canvas-next>=0.14.0", "common-prefect-next>=0.15.0", "prefect>=3.1.12", "snowflake-sqlalchemy>=1.7.1", "sqlalchemy>=2.0.36",
"snowflake-connector-python<3.14"]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"


[dependency-groups]
linters = [ "ruff>=0.8.0",]
dev = [
 "pre-commit>=4.1.0",
 "pytest>=8.3.3",
 "wheel>=0.45.1",
]

[tool.hatch.version]
path = "src/canvas_flows/__version__.py"

[tool.uv]
default-groups = [ "linters", "dev",]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [ "A", "ANN", "ASYNC", "B", "C4", "EM", "ERA", "ERA", "F", "FA", "FIX", "G", "I", "ICN", "LOG", "NPY", "PD", "PERF", "PGH", "PIE", "PL", "RUF", "SIM", "SLOT", "T10", "TC", "TCH", "TD", "TRY",]
ignore = [ "F401", "F403", "PLR0913", "FA100", "FA102", "PLR", "PLC0415", "RUF012", "PD901", "ANN401",]

[tool.pytest.ini_options]
log_cli = true
markers = [ "ddl",]

[tool.uv.sources.common-prefect-next]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common_prefect_next.git"
branch = "master"

[tool.uv.sources.common-canvas-next]
git = "https://git-codecommit.us-east-1.amazonaws.com/v1/repos/common-canvas-next.git"
branch = "master"

[tool.ruff.lint.per-file-ignores]
"src/canvas_flows/*.py" = [ "TC002",]
"tests/**.py" = [ "ANN",]

[tool.ruff.lint.flake8-type-checking]
quote-annotations = true
exempt-modules = [ "typing", "typing_extensions", "pydantic", "common_canvas_next.models.enums", "datetime",]
runtime-evaluated-base-classes = [ "common_canvas_next.models.ModelBase", "pydantic.BaseModel",]
