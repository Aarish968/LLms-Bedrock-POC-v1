# Generic metadata about this project
name: evidence_flows_prod
prefect-version: 3.2.13

# push section allows you to manage if and how this project is uploaded to remote locations
definitions:
  - &bundle_name evidence_flows_prod
  - &env prod
  - deployment_names:
      - &evidence_customer_upload_prod evidence_customer_upload_prod
      - &evidence_collector_upload_prod evidence_collector_upload_prod
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name:
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: evidence_flows,common_prefect_next,common_serial_resolution
  - entrypoints:
      - &upload_customer_evidence_entry evidence_flows.main:create_evidence_customer_flow
      - &upload_collector_evidence_entry evidence_flows.main:create_evidence_collector_flow
  - push: &prod_push
      - prefect.deployments.steps.run_shell_script:
          id: echo_version
          script: |
            uv run python -c "import importlib.metadata; print(importlib.metadata.version('evidence_flows'))"
          stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          extra_sources:
            - common-prefect-next
            - common-serial-resolution
          stream_output: true
          version: "{{echo_version.stdout}}"
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - pull: &prod_pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install /tmp/wheels/*.whl'


push: *prod_push

deployments:
  - name: *evidence_customer_upload_prod
    version: '{{echo_version.stdout}}'
    tags:
      - *env
      - create_evidence_customer
    concurrency_limit:
    description: "Upload a Customer Evidence File"
    entrypoint: *upload_customer_evidence_entry
    parameters: { "env": *env, "warehouse": '{{prefect.variables.warehouse_medium}}'}
    work_pool: *default_work_pool
    pull: *prod_pull
    enforce_parameter_schema: true

  - name: *evidence_collector_upload_prod
    version: '{{echo_version.stdout}}'
    tags:
      - *env
      - create_evidence_collector
    concurrency_limit:
    description: "Upload a Collector Evidence File"
    entrypoint: *upload_collector_evidence_entry
    parameters: { "env": *env, "warehouse": '{{prefect.variables.warehouse_medium}}'}
    work_pool: *default_work_pool
    pull: *prod_pull
    enforce_parameter_schema: true