# Generic metadata about this project
name: dc_evidence_collector_flow_dev
prefect-version: 3.2.13

# push section allows you to manage if and how this project is uploaded to remote locations
definitions:
  - &bundle_name dc_evidence_collector_flow_dev
  - &env dev
  - deployment_names:
      - &create_evidence_collector_dev create_evidence_collector_dev
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name:
      job_variables:
          image: "{{prefect.variables.docker_base_312}}"
          image_pull_policy: Always
          env:
            PREFECT_LOGGING_EXTRA_LOGGERS: dc_evidence_collector_flow,common_prefect_next
  - entrypoints:
      - &create_evidence_collector_entry dc_evidence_collector_flow.main:create_evidence_collector
  - push: &dev_push
      - prefect.deployments.steps.run_shell_script:
          id: echo_version
          script: |
            uv run python -c "import importlib.metadata; print(importlib.metadata.version('dc_evidence_collector_flow'))"
          stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          extra_sources:
            - common-prefect-next
          stream_output: true
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - pull: &dev_pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install --force-reinstall /tmp/wheels/*.whl'


push: *dev_push

deployments:
  - name: *create_evidence_collector_dev
    version:
    tags:
      - *env
      - create_evidence_collector
    concurrency_limit:
    description: "Submit Collector File"
    entrypoint: *create_evidence_collector_entry
    parameters: { "env": *env, "warehouse": '{{prefect.variables.warehouse_small}}'}
    work_pool: *default_work_pool
    pull: *dev_pull

    enforce_parameter_schema: true