# Generic metadata about this project
name: canvas_optimized_tables_prod
prefect-version: 3.4.1

definitions:
  # Generic metadata about this project
  - &bundle_name canvas_optimized_tables_prod
  - &env prod
  - deployment_names:
      - &update_last_updated_core_tables_prod update_last_update_core_prod
      - &canvas_optimized_tables_prod canvas_optimized_tables_prod
  - default_work_pool: &default_work_pool
      name: K8S
      work_queue_name: "{{prefect.variables.work_queue_prod}}"
      job_variables:
        image: "{{prefect.variables.docker_base}}"
        image_pull_policy: Always
        env:
          PREFECT_LOGGING_EXTRA_LOGGERS: canvas_optimized_tables
  - entrypoints:
      - &update_last_updated_core_tables_flow canvas_optimized_tables.main:update_last_updated_core_tables_flow
      - &make_optimized_tables_flow canvas_optimized_tables.main:make_optimized_tables_flow
  - prod_push: &prod_push
      - prefect.deployments.steps.run_shell_script:
          id: echo_version
          script: |
            uv run python -c "import importlib.metadata; print(importlib.metadata.version('canvas_optimized_tables'))"
          stream_output: true
      - common_prefect_next.deployments.steps.build_code_bundle:
          id: bundle_code
          bundle_name: *bundle_name
          extra_sources:
            - common_prefect_next
          stream_output: true
          version: "{{ echo_version.stdout }}"
          requires: common_prefect_next
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: dist
      - prefect_aws.deployments.steps.push_to_s3:
          id: push_code
          requires: prefect-aws>=0.3.4
          bucket: prefect2.flow.code
          folder: *bundle_name
      - prefect.deployments.steps.set_working_directory:
          id: set_working_directory
          directory: ..
  - prod_pull: &prod_pull
      - prefect_aws.deployments.steps.pull_from_s3:
          id: pull_code
          requires: prefect-aws>=0.3.4
          bucket: '{{ push_code.bucket }}'
          folder: '{{ push_code.folder }}'
      - prefect.deployments.steps.run_shell_script:
          id: install_bundle
          script: |
            mkdir -p /tmp/wheels
            tar -xzf {{bundle_code.stdout}} -C /tmp/wheels
            bash -c 'pip install /tmp/wheels/*.whl'
push: *prod_push

# pull section allows you to provide instructions for cloning this project in remote locations
pull: *prod_pull

daily_schedule: &daily_schedule
  - cron: "0 15 * * 1-5"
    timezone: "America/New_York"
    active: true

weekly_schedule: &weekly_schedule
  - cron: "0 15 * * 1"
    timezone: "America/New_York"
    active: true

hourly_schedule: &hourly_schedule
  - interval: 3600
    timezone: "America/New_York"
    active: true

four_hourly_schedule: &four_hourly_schedule
  - interval: 14400
    timezone: "America/New_York"
    active: true

deployments:
  - name: *update_last_updated_core_tables_prod
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
    concurrency_limit:
    description: "Updates last_updated column in core tables"
    entrypoint: *update_last_updated_core_tables_flow
    parameters: {
      "env": *env,
      "warehouse": '{{prefect.variables.warehouse_small}}'
    }
    work_pool: *default_work_pool
    enforce_parameter_schema: true
    schedules:
      *four_hourly_schedule
    <<: *prod_pull
  - name: *canvas_optimized_tables_prod
    version: "{{ echo_version.stdout }}"
    tags:
      - *env
    description: "Creates snapshots"
    entrypoint: *make_optimized_tables_flow
    parameters: {
      "env": *env,
      "warehouse": '{{prefect.variables.warehouse_huge}}'
    }
    work_pool: *default_work_pool
    enforce_parameter_schema: true
    schedules:
      *daily_schedule
    <<: *prod_pull
