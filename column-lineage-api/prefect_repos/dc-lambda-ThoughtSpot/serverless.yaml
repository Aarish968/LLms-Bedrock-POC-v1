service: dc-ts

frameworkVersion: "3.32.1"

provider:
  name: aws
  runtime: python3.8
  lambdaHashingVersion: 20201221
  vpc:
    securityGroupIds:
      - sg-01eb3d9e3bc49fdb5
    subnetIds:
      - subnet-01718f79205105bda
      - subnet-0c717a1ed2e396784
      - subnet-016385e62cdb1c088
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ssm:GetParameter
      Resource:
        Fn::Join:
          - ""
          - - "arn:aws:ssm:"
            - Ref: AWS::Region
            - ":"
            - Ref: AWS::AccountId
            - ":parameter/*"
    - Effect: "Allow"
      Action:
        - "*"
      Resource:
        - arn:aws:s3:::${self:custom.messageBucket}/*
        - arn:aws:s3:::${self:custom.messageBucket}


functions:
  thoughtspot:
    handler: handler.run
    layers:
      - { Ref: PythonRequirementsLambdaLayer }
    events:
      - s3:
          bucket: ${self:custom.messageBucket}
          event: s3:ObjectCreated:*
          rules:
            - prefix: requests/
            - suffix: .json
    environment:
      STAGE: ${opt:stage, 'dev'}
      PREFECT_API_URL: https://api.prefect.io/graphql
      PREFECT_VERSION_GROUP_ID: 8bd98867-3c57-417b-b310-a9fe37083a6e

plugins:
  - serverless-python-requirements
  - serverless-ignore
custom:
  pythonRequirements:
    dockerizePip: non-linux
    layer: true
  messageBucket: dc-ts-thought-spot-messaging.${opt:stage, 'dev'}
